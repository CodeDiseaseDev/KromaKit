<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DirectUI Color Preview</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0c0d10;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px;
            font-weight: 500;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            width: 200px;
            height: 200px;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: #fff;
            /*border: 1px solid rgba(255,255,255,0.08);*/
        }

        .primary {
            background: rgb(12,13,16);
        }

        .secondary {
            background: rgb(23, 24, 27);
        }

        .tertiary {
            background: rgb(34, 35, 40);
        }

        .label {
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>DirectUI Background Palette</h1>

<div class="container">
<!--    <div class="box primary">-->
<!--        <div class="label">Primary</div>-->
<!--    </div>-->
    <div class="box secondary">
        <div class="label">Secondary</div>
    </div>
    <div class="box tertiary">
        <div class="label">Tertiary</div>
    </div>

    <div class="box secondary" style="width: 200px;">
        <div class="box tertiary" style="width: 160px; height: 120px;">
            <div class="label">Secondary -> Tertiary</div>
        </div>
    </div>
</div>

</body>
</html>
